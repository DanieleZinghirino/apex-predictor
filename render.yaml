# Configurazione dichiarativa per Render
services:
  - type: web
    name: apex-predictor
    runtime: python
    buildCommand: "pip install -r requirements-deploy.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # false = va inserito manualmente nella dashboard Render
      - key: PYTHON_VERSION
        value: "3.12.3"